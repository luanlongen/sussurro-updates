name: Update Endpoint

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., 0.1.2)'
        required: true
      exe_url:
        description: 'Download URL for .exe'
        required: true
      signature:
        description: 'Base64 signature content'
        required: true

jobs:
  update-endpoint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Update latest.json
        run: |
          cat > latest.json << EOF
          {
            "version": "${{ github.event.inputs.version }}",
            "notes": "Versao ${{ github.event.inputs.version }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${{ github.event.inputs.signature }}",
                "url": "${{ github.event.inputs.exe_url }}"
              }
            }
          }
          EOF
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "feat: update endpoint to v${{ github.event.inputs.version }}"
          git push
